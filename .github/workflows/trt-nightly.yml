name: trt-nightly

# Real TensorRT engine builds and parity need CUDA + the tensorrt package,
# which GitHub-hosted runners do not provide. This workflow targets a
# self-hosted GPU runner labelled `tensorrt`; keep it out of the PR gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"  # weekly, Sunday 03:17 UTC

jobs:
  trt-parity:
    runs-on: [self-hosted, linux, gpu, tensorrt]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with export + vision extras
        run: pip install -e ".[dev,export,transformers]"
      - name: Engine build + torch-vs-engine parity (int8 QDQ path)
        env:
          AUTOVISION_TRT_TESTS: "1"
          AUTOVISION_TELEMETRY: "0"
        # export_tensorrt(verify=True) also runs the new fp32/fp16 engine
        # parity gate inside this path; the int8 builder is the slow one.
        run: pytest tests/test_trt_int8.py -q --maxfail=1
      - name: DDP + FSDP torchrun smoke
        env:
          AUTOVISION_DDP_TESTS: "1"
          AUTOVISION_TELEMETRY: "0"
          NCCL_MULTI_RANK_GPU_ENABLE: "1"
        run: pytest tests/test_torchrun_distributed.py -q --maxfail=1
