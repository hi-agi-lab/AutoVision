apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autovision-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autovision-serving
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
